<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DairyPad</title>

  <!-- Google Fonts: Outfit & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Bootstrap 5.3.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="icon" type="image/jpeg" href="logo.jpg">

  <!-- Custom Styling -->
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-body-tertiary">

  <div class="app-wrapper">
    <div class="container app-container">

      <!-- Main DairyPad Card (Fit to 100vh with no scroll) -->
      <main class="card main-card shadow-sm border-0">
        <div class="card-body">

          <!-- 1. TOP RECTANGLE: DATE DISPLAY & PICKER -->
          <div class="date-rectangle-wrapper" id="dateCardWrapper" title="Click to change date">
            <div class="date-rectangle d-flex align-items-center justify-content-between p-2 rounded-3 shadow-sm">
              <button class="btn btn-sm btn-link text-body-secondary p-0 text-decoration-none date-nav-btn"
                id="prevDayBtn" title="Previous Day">
                <i class="bi bi-chevron-left"></i>
              </button>

              <div class="text-center flex-grow-1 mx-2 user-select-none" id="dateDisplayContainer">
                <div class="date-text fw-bold" id="dateDisplayText">
                  -- October ----
                </div>
              </div>

              <button class="btn btn-sm btn-link text-body-secondary p-0 text-decoration-none date-nav-btn"
                id="nextDayBtn" title="Next Day">
                <i class="bi bi-chevron-right"></i>
              </button>
            </div>

            <!-- Hidden Native HTML5 Date Picker triggered on click -->
            <input type="date" id="nativeDatePicker" class="visually-hidden" aria-label="Delivery Date">
          </div>

          <!-- 2. PRODUCT LIST (MILK, GHEE, CURD & CUSTOM ITEMS) -->
          <div class="product-list-container d-flex flex-column gap-1" id="productList">
            <!-- Dynamically populated / Default items rendered here -->
          </div>

          <!-- 3. EXTRA ITEM INPUT ROW (Directly below items list) -->
          <div class="extra-item-section p-2 rounded-3 border">
            <div class="row g-1 align-items-center">
              <div class="col-6">
                <input type="text" class="form-control form-control-sm" id="extraItemName"
                  placeholder="+ Custom item (Paneer...)" aria-label="Extra item name">
              </div>

              <div class="col-4">
                <div class="input-group input-group-sm">
                  <input type="text" inputmode="decimal"
                    class="form-control form-control-sm font-monospace fw-bold text-end" id="extraItemQty"
                    placeholder="" value="" aria-label="Extra item quantity">
                  <select class="form-select unit-dropdown" id="extraItemUnit" aria-label="Extra item unit">
                    <option value="Kg" selected>Kg</option>
                    <option value="L">L</option>
                    <option value="g">g</option>
                    <option value="ml">ml</option>
                  </select>
                </div>
              </div>

              <div class="col-2">
                <button
                  class="btn btn-primary btn-sm w-100 fw-bold d-flex align-items-center justify-content-center add-item-btn"
                  id="addExtraItemBtn" title="Add Item">
                  <i class="bi bi-plus-lg"></i>
                </button>
              </div>
            </div>
          </div>

          <!-- 4. LOCKED BOTTOM DOCK: SEND BUTTON + QUICK STEP BUTTONS -->
          <div class="locked-bottom-dock">
            <!-- Central Oval Send Button -->
            <button
              class="btn btn-success send-oval-btn shadow w-100 fw-bold text-white position-relative overflow-hidden"
              id="sendBtn">
              <span class="send-btn-content d-flex align-items-center justify-content-center gap-2">
                <i class="bi bi-whatsapp fs-5"></i>
                <span class="letter-spacing-1 text-uppercase">Send</span>
              </span>
              <div class="send-hold-progress" id="sendHoldProgress"></div>
            </button>

            <!-- Bottom Step Buttons: [ - ] [ +0.5 ] | [ +1.0 ] [ - ] -->
            <div class="quick-increment-section">
              <div class="d-flex align-items-center justify-content-center gap-2">
                <!-- Left Minus Button: -0.5 -->
                <button class="btn quick-step-btn minus-btn shadow-sm" id="quickMinus05Btn" title="Minus 0.5"
                  aria-label="Minus 0.5">
                  <span class="step-symbol fw-bold">&minus;</span>
                </button>

                <!-- Left Oval: +0.5 -->
                <button
                  class="btn quick-oval-btn left-oval shadow-sm d-flex flex-column align-items-center justify-content-center"
                  id="quickAdd05Btn" title="Add 0.5">
                  <span class="oval-plus-symbol fw-bolder">+0.5</span>
                  <span class="oval-unit-label small fw-semibold" id="ovalUnit05">Kg</span>
                </button>

                <!-- Thin grey vertical line between both + buttons -->
                <div class="quick-buttons-divider" aria-hidden="true"></div>

                <!-- Right Oval: +1.0 -->
                <button
                  class="btn quick-oval-btn right-oval shadow-sm d-flex flex-column align-items-center justify-content-center"
                  id="quickAdd10Btn" title="Add 1.0">
                  <span class="oval-plus-symbol fw-bolder">+1.0</span>
                  <span class="oval-unit-label small fw-semibold" id="ovalUnit10">Kg</span>
                </button>

                <!-- Right Minus Button: -1.0 -->
                <button class="btn quick-step-btn minus-btn shadow-sm" id="quickMinus10Btn" title="Minus 1.0"
                  aria-label="Minus 1.0">
                  <span class="step-symbol fw-bold">&minus;</span>
                </button>
              </div>
            </div>
          </div>

        </div>
      </main>

    </div>
  </div>

  <!-- Number Change Modal (Triggered by 3s Long Press on Send Button) -->
  <div class="modal fade" id="numberModal" tabindex="-1" aria-labelledby="numberModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 380px;">
      <div class="modal-content rounded-4 border-0 shadow">
        <div class="modal-header border-bottom-0 pb-1">
          <h5 class="modal-title fw-bold" id="numberModalLabel">
            <i class="bi bi-whatsapp text-success me-2"></i>Change WhatsApp Number
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body py-2">
          <p class="text-muted small mb-2">
            Enter a 10 digit whatsapp number
          </p>
          <div class="input-group mb-1">
            <span class="input-group-text bg-body-secondary fw-bold text-secondary font-monospace"
              id="countryCodePrefix">+91</span>
            <input type="tel" class="form-control font-monospace fs-5 fw-bold" id="modalPhoneNumberInput"
              placeholder="9876543210" maxlength="10" inputmode="tel">
          </div>
        </div>
        <div class="modal-footer border-top-0 pt-1 d-flex justify-content-end gap-2">
          <button type="button" class="btn btn-secondary rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-dp-primary rounded-pill px-4 fw-bold" id="saveNumberBtn">Save</button>
        </div>
      </div>
    </div>
  </div>


  <!-- Toast Notification Container -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100;">
    <div id="appToast" class="toast align-items-center text-white bg-primary border-0 rounded-3 shadow" role="alert"
      aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body d-flex align-items-center gap-2" id="toastMessage">
          <i class="bi bi-info-circle"></i> Notification message
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
          aria-label="Close"></button>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5.3.3 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Application JS -->
  <script src="app.js"></script>
</body>

</html>
